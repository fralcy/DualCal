<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Dual solar/lunar calendar with reminders, holidays, and a soft neumorphic theme.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="DualCal">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>DualCal</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!--
    GitHub Pages doesn't let us set cache-control headers, so a browser can
    keep serving an old cached main.dart.js/flutter_bootstrap.js for a
    while after a new version is deployed. Stale-while-revalidate, once per
    app open only (no background polling loop): the page renders
    immediately from whatever's cached, and in parallel this fetches the
    tiny flutter_bootstrap.js (~1KB) bypassing the HTTP cache and compares
    it against the fingerprint left over from the last time the app was
    opened (in localStorage). If they differ, this load was stale —
    silently reload once to catch up. Nothing runs after that single
    check; the next check only happens the next time the app is opened.
  -->
  <script>
    (function () {
      var STORAGE_KEY = 'dualcal_bootstrap_fingerprint';
      var checkUrl = new URL('flutter_bootstrap.js', document.baseURI).toString();

      fetch(checkUrl, { cache: 'no-store' })
        .then(function (res) { return res.ok ? res.text() : null; })
        .then(function (fresh) {
          if (fresh == null) return;
          var stored = null;
          try {
            stored = localStorage.getItem(STORAGE_KEY);
          } catch (e) {
            // Private browsing / storage disabled — just skip the check.
            return;
          }
          try {
            localStorage.setItem(STORAGE_KEY, fresh);
          } catch (e) {
            // Ignore — worst case we re-check against the same baseline next time.
          }
          if (stored !== null && stored !== fresh) {
            window.location.reload();
          }
        })
        .catch(function () {
          // Offline, or the request was blocked — just try again next open.
        });
    })();
  </script>
</body>
</html>
