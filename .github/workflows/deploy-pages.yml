name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: dart run build_runner build --delete-conflicting-outputs

      # --pwa-strategy=none disables Flutter's own generated service
      # worker (it never actually cached anything — see
      # web/dualcal_service_worker.js for the real offline caching), so
      # only our own service worker controls the page. The flag itself is
      # deprecated upstream (flutter/flutter#156910) and may need
      # replacing on a future Flutter upgrade; if it's ever removed,
      # Flutter's default is expected to be "register nothing" anyway,
      # matching what we want here.
      - run: flutter build web --release --base-href /DualCal/ --pwa-strategy=none

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
